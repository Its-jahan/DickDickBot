# DickDickBot admin panel on its own subdomain, proxied through Cloudflare.
server {
    listen 80;
    listen [::]:80;
    server_name admin.inddex.app;

    # Kept so certbot can renew: Cloudflare passes plain HTTP through to the origin,
    # which is what carries the ACME challenge for a proxied hostname.
    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.inddex.app;

    ssl_certificate /etc/letsencrypt/live/admin.inddex.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.inddex.app/privkey.pem;

    # The panel owns this whole hostname, so it is served at the root and no
    # X-Forwarded-Prefix is sent - Flask builds plain "/..." URLs here.
    location / {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        # Cloudflare is in front, so the socket peer is a CF edge IP; CF-Connecting-IP
        # is the only header carrying the real visitor address.
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
