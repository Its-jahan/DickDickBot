name: Deploy to server

# Auto-deploy: every push to main (and manual runs) SSHes into the server,
# pulls the latest code, updates dependencies and restarts the systemd service.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            cd /opt/DickDickBot
            git fetch origin main
            git checkout main 2>/dev/null || git checkout -b main origin/main
            git reset --hard origin/main
            /opt/DickDickBot/venv/bin/pip install -r python_bot/requirements.txt
            systemctl restart dickbot
            sleep 2
            systemctl is-active dickbot
            echo "--- last 200 lines of dickbot journal (for diagnostics) ---"
            journalctl -u dickbot -n 200 --no-pager || true
            # The admin panel is a separate gunicorn service (admin_panel.py) that this
            # checkout also updates on disk, but a running gunicorn worker keeps executing
            # the old Python code until it's restarted - so a push that only touches
            # admin_panel.py would silently not take effect without this.
            if systemctl list-unit-files dickbot-admin.service >/dev/null 2>&1; then
              systemctl restart dickbot-admin
              sleep 2
              systemctl is-active dickbot-admin
            fi
