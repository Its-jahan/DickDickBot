<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دودول</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0e1116; --card:#171b22; --card2:#1f242d; --line:#272d38;
  --tx:#e8ecf3; --dim:#8b95a7; --acc:#5b8cff; --up:#3ddc84; --dn:#ff6b6b;
  --gold:#ffc857; --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);
  font-family:"Vazirmatn","Segoe UI",system-ui,-apple-system,sans-serif;
  padding-bottom:84px;line-height:1.7}
.wrap{max-width:640px;margin:0 auto;padding:16px}
h2{font-size:17px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row+.row{margin-top:10px}
.dim{color:var(--dim);font-size:13px}
.big{font-size:32px;font-weight:800;letter-spacing:-.5px}
.up{color:var(--up)} .dn{color:var(--dn)} .gold{color:var(--gold)}
.pill{background:var(--card2);border:1px solid var(--line);border-radius:999px;
  padding:3px 11px;font-size:12px;color:var(--dim);white-space:nowrap}
button{font-family:inherit;font-size:14px;border:0;border-radius:12px;padding:11px 16px;
  background:var(--acc);color:#fff;font-weight:700;cursor:pointer}
button:disabled{opacity:.45}
button.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
button.sm{padding:7px 12px;font-size:13px;border-radius:10px}
input{font-family:inherit;font-size:15px;background:var(--card2);color:var(--tx);
  border:1px solid var(--line);border-radius:12px;padding:11px;width:100%;text-align:center}
nav{position:fixed;inset-inline:0;bottom:0;background:#12161ccc;
  backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:9}
nav button{flex:1;background:none;color:var(--dim);font-size:10px;font-weight:600;
  padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--acc)}
nav i{font-style:normal;font-size:19px;line-height:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card2);border-radius:12px;padding:12px}
.stat b{display:block;font-size:19px;margin-top:2px}
.coin{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.coin:last-child{border-bottom:0}
.coin .nm{flex:1;min-width:0}
.coin .nm b{display:block;font-size:15px}
.px{text-align:left;font-variant-numeric:tabular-nums}
.rk{width:26px;text-align:center;color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
.me{background:#5b8cff1a;margin-inline:-8px;padding-inline:8px;border-radius:10px}
.toast{position:fixed;inset-inline:16px;bottom:96px;background:#242a34;
  border:1px solid var(--line);border-radius:14px;padding:13px 16px;font-size:14px;
  z-index:20;box-shadow:0 10px 34px #0008;opacity:0;transform:translateY(10px);
  transition:.22s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.toast.bad{border-color:#ff6b6b66}
.sheet{position:fixed;inset:0;background:#000a;z-index:30;display:none;
  align-items:flex-end;justify-content:center}
.sheet.show{display:flex}
.sheet .inner{background:var(--card);width:100%;max-width:640px;
  border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;background:var(--card2);color:var(--dim);border:1px solid var(--line)}
.tabs button.on{background:var(--acc);color:#fff;border-color:transparent}
.empty{text-align:center;color:var(--dim);padding:36px 10px;font-size:14px}
.bar{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:7px}
.bar>i{display:block;height:100%;background:var(--acc)}
a.tg{color:var(--acc);text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">در حال بارگذاری…</div></div>
<nav id="nav" style="display:none"></nav>
<div class="toast" id="toast"></div>
<div class="sheet" id="sheet"><div class="inner" id="sheetIn"></div></div>
<script>
const TG = window.Telegram?.WebApp;
if (TG) { TG.ready(); TG.expand(); }
const S = { chat: null, tab: 'home', data: {}, groups: [], name: '' };
const app = document.getElementById('app'), nav = document.getElementById('nav');

const fa = n => (n ?? 0).toLocaleString('fa-IR');
const num = (n, d=0) => (n ?? 0).toLocaleString('fa-IR', {minimumFractionDigits:d, maximumFractionDigits:d});
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pc = n => (n>=0?'+':'') + num(n,2) + '٪';

function toast(msg, bad) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (bad ? ' bad' : '');
  clearTimeout(t._t); t._t = setTimeout(() => t.className = 'toast', 3200);
  if (TG?.HapticFeedback) TG.HapticFeedback.notificationOccurred(bad ? 'error' : 'success');
}
function sheet(html) {
  const s = document.getElementById('sheet');
  document.getElementById('sheetIn').innerHTML = html;
  s.className = 'sheet show';
  s.onclick = e => { if (e.target === s) s.className = 'sheet'; };
}
const closeSheet = () => document.getElementById('sheet').className = 'sheet';

async function api(path, body) {
  const opt = { headers: { 'X-Telegram-Init-Data': TG?.initData || '' } };
  if (body) {
    opt.method = 'POST';
    opt.headers['Content-Type'] = 'application/json';
    opt.body = JSON.stringify({ ...body, chat_id: S.chat });
  }
  const url = path + (body ? '' : (path.includes('?') ? '&' : '?') + 'chat_id=' + S.chat);
  const r = await fetch(url, opt);
  const j = await r.json().catch(() => ({ ok:false, error:'پاسخ نامعتبر از سرور' }));
  if (!j.ok) throw new Error(j.error || 'خطا');
  return j;
}

const TABS = [
  ['home','🏠','خونه'], ['top','🏆','جدول'], ['crypto','📉','بازار'],
  ['bank','🏦','بانک'], ['shop','🏪','فروشگاه'], ['bag','🎒','کوله'],
];
function drawNav() {
  nav.style.display = 'flex';
  nav.innerHTML = TABS.map(([k,i,l]) =>
    `<button class="${S.tab===k?'on':''}" onclick="go('${k}')"><i>${i}</i>${l}</button>`).join('');
}
window.go = async k => { S.tab = k; drawNav(); await render(); };

// ---------------------------------------------------------------- screens
const V = {};

V.home = d => `
  <div class="card">
    <div class="row"><span class="dim">سایز تو</span>
      <span class="pill">${d.rank ? `رتبه ${fa(d.rank)} از ${fa(d.players)}` : 'بدون رتبه'}</span></div>
    <div class="big">${num(d.size)} <span class="dim" style="font-size:15px">سانت</span></div>
    <div class="row" style="margin-top:14px">
      <span class="pill">${d.perk && d.perk!=='عادی' ? '✨ '+esc(d.perk) : 'بدون پرک'}</span>
      <span class="pill">${d.grown_today ? '✅ امروز رشد کردی' : '⏳ امروز رشد نکردی'}</span>
    </div>
  </div>
  <div class="grid">
    <div class="stat"><span class="dim">بانک</span><b>${num(d.bank)}</b>
      <span class="dim">${num(d.bank_rate*100,2)}٪ − ${num(d.maintenance*100,2)}٪ روزانه</span></div>
    <div class="stat"><span class="dim">سبد کریپتو</span><b>${num(d.portfolio)}</b>
      <span class="dim">تا نفروشی سایز نیست</span></div>
    <div class="stat"><span class="dim">پادشاه</span><b style="font-size:15px">${d.is_king?'👑 خودتی':esc(d.king||'—')}</b>
      <span class="dim">${d.consort?'💍 '+esc(d.consort):'بدون همسر'}</span></div>
    <div class="stat"><span class="dim">تورم</span><b>${num(d.inflation,2)}×</b>
      <span class="dim">خشم مردم ${fa(Math.round(d.unrest))}</span></div>
  </div>
  <div class="card">
    <div class="dim" style="margin-bottom:10px">اینا فقط توی گروه کار می‌کنن، چون بقیه باید ببیننشون:</div>
    <div class="row" style="flex-wrap:wrap;gap:8px">
      ${['d|رشد روزانه','c|چالش','dozdi|دزدی','ejma|اجماع','sarghat|سرقت از بانک','farman|فرمان']
        .map(x=>{const [c,l]=x.split('|');
        return `<span class="pill" style="cursor:pointer" onclick="chat('${c}')">/${c} · ${l}</span>`}).join('')}
    </div>
  </div>`;

V.top = d => d.rows.length ? `<div class="card">` + d.rows.map((r,i) => `
    <div class="row ${r.user_id===d.me?'me':''}" style="padding:9px 0">
      <span class="rk">${i<3?['🥇','🥈','🥉'][i]:fa(i+1)}</span>
      <span style="flex:1">${esc(r.name)} ${r.king?'👑':''}${r.consort?'💍':''}
        ${r.streak>1?`<span class="dim">🔥${fa(r.streak)}</span>`:''}</span>
      <b class="px">${num(r.size)}</b>
    </div>`).join('') + `</div>` : `<div class="empty">هنوز کسی بازی نکرده</div>`;

V.crypto = d => `
  <div class="card">
    <div class="row"><span class="dim">جیب</span><b>${num(d.wallet)} سانت</b></div>
    <div class="row"><span class="dim">سقف خرید امروز</span><b>${fa(d.cap)}</b></div>
    <div class="row"><span class="dim">نقدینگی بانک مرکزی</span><b>${num(d.liquidity)}</b></div>
  </div>
  <div class="card">` + d.coins.map(c => `
    <div class="coin" onclick="trade('${c.symbol}')">
      <span style="font-size:19px">${c.change>0.01?'🟢':c.change<-0.01?'🔴':'⚪️'}</span>
      <span class="nm"><b>${esc(c.name)}</b>
        <span class="dim">${c.units>0?`تو: ${num(c.units,4)} · ${num(c.value)} سانت`
          : (Math.abs(c.demand)>0.005 ? (c.demand>0?'🔥 تقاضا ':'🧊 تقاضا ')+pc(c.demand*100) : c.symbol)}</span></span>
      <span class="px"><b>${num(c.price,2)}</b>
        <span class="dim ${c.change>=0?'up':'dn'}" style="display:block">${pc(c.change)}</span></span>
    </div>`).join('') + `</div>
  <div class="dim" style="text-align:center;padding:0 10px 10px">
    کارمزد هر معامله ${num(d.fee*100)}٪. خرید قیمت رو بالا می‌بره و فروش پایین —
    ولی قیمتی که بهت می‌خوره میانگین مسیره، پس پامپ‌کردن سودی نداره.</div>`;

V.bank = d => `
  <div class="card">
    <div class="row"><span class="dim">جیب (قابل دزدیدن)</span><b>${num(d.wallet)}</b></div>
    <div class="row"><span class="dim">بانک (امن از دزدی)</span><b>${num(d.balance)}</b></div>
    <div class="row"><span class="dim">سقف واریز امروز</span>
      <b>${fa(d.remaining)} از ${fa(d.cap)}</b></div>
    <div class="bar"><i style="width:${d.cap?100-Math.round(d.remaining/d.cap*100):0}%"></i></div>
  </div>
  <div class="card">
    <div class="row"><span class="dim">سود روزانه</span><b class="up">${num(d.rate*100,2)}٪</b></div>
    <div class="row"><span class="dim">کارمزد نگهداری</span><b class="dn">−${num(d.maintenance*100,2)}٪</b></div>
    <div class="row"><span>خالص برای تو</span>
      <b class="${d.rate-d.maintenance>=0?'up':'dn'}">${pc((d.rate-d.maintenance)*100)}</b></div>
  </div>
  <div class="card">
    <div class="tabs">
      <button class="on" onclick="bankTab(this,'in')">واریز</button>
      <button onclick="bankTab(this,'out')">برداشت</button>
    </div>
    <input id="bamt" type="number" inputmode="numeric" placeholder="مقدار سانت">
    <div style="height:10px"></div>
    <button style="width:100%" onclick="bankGo()"><span id="blabel">واریز به بانک</span></button>
    <div class="dim" style="text-align:center;margin-top:9px" id="bfee">
      کارمزد واریز ${num(d.deposit_fee*100)}٪</div>
  </div>
  <div class="card">
    <h2>🏛 بانک مرکزی</h2>
    <div class="row"><span class="dim">ذخیره</span><b>${num(d.reserve)}</b></div>
    <div class="row"><span class="dim">سپردهٔ مردم (بدهی بانک)</span><b>${num(d.deposits)}</b></div>
    <div class="row"><span class="dim">وام‌های بیرون‌رفته</span><b>${num(d.loans_out)}</b></div>
    <div class="row"><span class="dim">نقدِ قابل‌برداشت</span><b>${num(d.cash)}</b></div>
    <div class="row"><span class="dim">نرخ وام</span><b>${num(d.loan_rate*100)}٪</b></div>
  </div>`;

V.shop = d => `
  <div class="card"><div class="row"><span class="dim">جیب</span><b>${num(d.wallet)} سانت</b>
    </div><div class="row"><span class="dim">تورم</span><b>${num(d.inflation,2)}×</b></div></div>
  ` + d.items.map(it => `
  <div class="card">
    <div class="row"><b>${esc(it.name)}</b><b class="gold">${fa(it.price)} سانت</b></div>
    <div class="dim" style="margin:6px 0 10px">${esc(it.desc)}</div>
    <div class="row">
      <span class="pill">امروز ${fa(it.day_left)} · این هفته ${fa(it.week_left)}</span>
      <button class="sm" ${it.day_left<=0||it.week_left<=0||d.wallet<it.price?'disabled':''}
        onclick="buyItem('${esc(it.name)}')">خرید</button>
    </div>
  </div>`).join('');

V.bag = d => d.items.length ? d.items.map(it => `
  <div class="card">
    <div class="row"><b>${esc(it.name)} × ${fa(it.count)}</b>
      ${it.usable ? `<button class="sm ghost" onclick="useItem('${esc(it.name)}')">فعال‌کردن</button>` : ''}</div>
    <div class="dim" style="margin-top:6px">${esc(it.desc)}</div>
    ${it.usable ? '' : '<div class="dim" style="margin-top:6px">این آیتم رو باید توی گروه استفاده کنی</div>'}
  </div>`).join('') : `<div class="empty">کوله‌ت خالیه — از فروشگاه بخر یا با /d شانس بیار</div>`;

// ---------------------------------------------------------------- actions
let bankMode = 'in';
window.bankTab = (el, m) => {
  bankMode = m;
  [...el.parentNode.children].forEach(b => b.className = b === el ? 'on' : '');
  document.getElementById('blabel').textContent = m === 'in' ? 'واریز به بانک' : 'برداشت از بانک';
  const d = S.data.bank;
  document.getElementById('bfee').textContent =
    m === 'in' ? `کارمزد واریز ${num(d.deposit_fee*100)}٪` : `کارمزد برداشت ${num(d.withdraw_fee*100)}٪`;
};
window.bankGo = async () => {
  const v = +document.getElementById('bamt').value;
  if (!v) return toast('مقدار رو بنویس', true);
  try {
    const r = await api('/api/bank/' + (bankMode === 'in' ? 'deposit' : 'withdraw'), { amount: v });
    toast(r.message); await render();
  } catch (e) { toast(e.message, true); }
};

window.trade = sym => {
  const c = S.data.crypto.coins.find(x => x.symbol === sym);
  sheet(`
    <div class="row"><b style="font-size:18px">${esc(c.name)}</b>
      <b>${num(c.price,2)} سانت</b></div>
    <div class="row"><span class="dim">نسبت به پایه</span>
      <span class="${c.vs_base>=0?'up':'dn'}">${pc(c.vs_base)}</span></div>
    ${c.units>0?`<div class="row"><span class="dim">موجودی تو</span>
      <span>${num(c.units,4)} · میانگین خرید ${num(c.avg_cost,2)}</span></div>`:''}
    <div style="height:14px"></div>
    <input id="camt" type="number" inputmode="numeric" placeholder="مقدار سانت">
    <div style="height:10px"></div>
    <div class="row">
      <button style="flex:1" onclick="cbuy('${sym}')">خرید</button>
      <button class="ghost" style="flex:1" onclick="csell('${sym}',0)" ${c.units>0?'':'disabled'}>فروش</button>
      <button class="ghost" style="flex:1" onclick="csell('${sym}',1)" ${c.units>0?'':'disabled'}>فروش همه</button>
    </div>
    <div class="dim" style="text-align:center;margin-top:10px">کارمزد ${num(S.data.crypto.fee*100)}٪ هر طرف</div>`);
};
window.cbuy = async sym => {
  const v = +document.getElementById('camt').value;
  if (!v) return toast('مقدار رو بنویس', true);
  try { const r = await api('/api/crypto/buy', { symbol: sym, spend: v });
    closeSheet(); toast(r.message); await render(); }
  catch (e) { toast(e.message, true); }
};
window.csell = async (sym, all) => {
  const v = +document.getElementById('camt').value;
  if (!all && !v) return toast('مقدار رو بنویس', true);
  try { const r = await api('/api/crypto/sell', all ? { symbol: sym, all: 1 } : { symbol: sym, amount: v });
    closeSheet(); toast(r.message); await render(); }
  catch (e) { toast(e.message, true); }
};
window.buyItem = async name => {
  try { const r = await api('/api/shop/buy', { item: name }); toast(r.message); await render(); }
  catch (e) { toast(e.message, true); }
};
window.useItem = async name => {
  try { const r = await api('/api/inventory/use', { item: name }); toast(r.message); await render(); }
  catch (e) { toast(e.message, true); }
};
window.chat = cmd => {
  if (TG) { TG.close(); }
  toast('توی گروه بزن: /' + cmd);
};

// ---------------------------------------------------------------- boot
const ENDPOINT = { home:'/api/home', top:'/api/top', crypto:'/api/crypto',
                   bank:'/api/bank', shop:'/api/shop', bag:'/api/inventory' };
const USABLE = ['دستکش','کیسه','بلیت طلایی'];

async function render() {
  try {
    const d = await api(ENDPOINT[S.tab]);
    if (S.tab === 'bag') d.items.forEach(i => i.usable = USABLE.includes(i.name));
    S.data[S.tab] = d;
    app.innerHTML = V[S.tab](d);
  } catch (e) {
    app.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

function pickGroup() {
  nav.style.display = 'none';
  app.innerHTML = `<h2>سلام ${esc(S.name)} 👋</h2>
    <div class="dim" style="margin-bottom:14px">کدوم گروه؟ هر گروه لیگ جداگانهٔ خودشه.</div>`
    + S.groups.map(g => `<div class="card" style="cursor:pointer" onclick="pick(${g.chat_id})">
        <div class="row"><b>${esc(g.title)}</b><b>${num(g.size)} سانت</b></div></div>`).join('');
}
window.pick = async id => { S.chat = id; try { localStorage.setItem('chat', id); } catch(e){} 
  drawNav(); await render(); };

(async () => {
  if (!TG?.initData) {
    app.innerHTML = `<div class="empty">این صفحه رو باید از داخل تلگرام باز کنی.<br>
      توی گروه بزن <b>/app</b></div>`;
    return;
  }
  try {
    const r = await fetch('/api/groups', { headers: { 'X-Telegram-Init-Data': TG.initData } });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    S.name = j.name; S.groups = j.groups;
    if (!j.groups.length) {
      app.innerHTML = `<div class="empty">هنوز توی هیچ گروهی بازی نکردی.<br>
        اول توی گروه یه بار <b>/d</b> بزن.</div>`;
      return;
    }
    let saved = null; try { saved = +localStorage.getItem('chat'); } catch(e){}
    if (j.groups.length === 1) return pick(j.groups[0].chat_id);
    if (saved && j.groups.some(g => g.chat_id === saved)) return pick(saved);
    pickGroup();
  } catch (e) {
    app.innerHTML = `<div class="empty">${esc(e.message || 'خطا در اتصال')}</div>`;
  }
})();
</script>
</body>
</html>
